services:
  fuseki:
    image: stain/jena-fuseki:4.8.0
    container_name: fuseki-music
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: admin
      JVM_ARGS: -Xmx2g
      FUSEKI_BASE: /fuseki
    volumes:
      - fuseki_data:/fuseki
      - ./config.ttl:/fuseki/config.ttl

volumes:
  fuseki_data: